name: Merge M3U Playlists

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'urls.txt'

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and combine M3U playlists
        run: |
          echo "#EXTM3U" > combined.m3u
          while IFS= read -r url || [ -n "$url" ]; do
            if [[ -n "$url" && ! "$url" =~ ^# ]]; then
              curl -sL "$url" | grep -v "^#EXTM3U" >> combined.m3u || true
            fi
          done < urls.txt

      - name: Save combined playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add combined.m3u
          git diff --staged --quiet || (git commit -m "Update combined.m3u" && git push)
